<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroSplit - Expense Splitter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h1>GroSplit - Shared Expense Splitter</h1>

      <!-- Active Group Info & Selection -->
      <div id="groupHeaderSection" class="card">
        <h2>Active Group: <span id="groupNameDisplay">Loading...</span></h2>
        <p>Group ID: <code id="groupIdDisplay">-</code></p>
        <div id="groupMembersList">
          <strong>Members:</strong> <span id="membersDisplay">-</span>
        </div>
      </div>

      <!-- Add Expense Section -->
      <div id="itemSection" class="card">
        <h2>Add Expense</h2>
        <div>
          <label for="payerSelect">Paid By:</label>
          <select id="payerSelect">
            <option value="">Select Payer</option>
          </select>
        </div>
        <br />
        <input type="text" id="itemName" placeholder="Description / Item Name" />
        <input type="number" id="itemPrice" step="0.01" placeholder="Amount (€)" />
        <div>
          <br />
          <label>
            <input
              type="checkbox"
              id="selectAll"
              onclick="selectAllParticipants()"
            />
            Select All Participants
          </label>
          <br /><br />
          <div id="participantsCheckboxContainer"></div>
        </div>
        <br />
        <button onclick="addExpense()">Add Expense</button>
      </div>

      <!-- Display Expenses List -->
      <div class="card">
        <h2>Expenses Added</h2>
        <ul id="itemsList"></ul>
      </div>

      <!-- Calculate Balances & Debt Simplification Button -->
      <div class="card">
        <button onclick="calculateSplit()">Calculate Balances & Simplified Debts</button>
      </div>

      <!-- Result Section -->
      <div class="card">
        <h2>Net Balances Per Person</h2>
        <ul id="resultList"></ul>

        <h2>Suggested Debt Settlements</h2>
        <ul id="suggestedSettlementsList"></ul>
      </div>

      <!-- Record Settlement Section -->
      <div class="card">
        <h2>Record a Repayment</h2>
        <div>
          <label for="settlementFrom">From (Payer):</label>
          <select id="settlementFrom"></select>
          <label for="settlementTo">To (Recipient):</label>
          <select id="settlementTo"></select>
          <input type="number" id="settlementAmount" step="0.01" placeholder="Amount (€)" />
          <button onclick="recordSettlement()">Record Repayment</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
